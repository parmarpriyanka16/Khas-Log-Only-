<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Elite Circle</title>
    <style>
        /* Har screen par zabaardast chalne wala background */
        html, body {
            background-color: #0b0b14 !important;
            background: linear-gradient(180deg, #0e0e1a 0%, #05050a 100%) !important;
            color: #ffffff !important;
            margin: 0 !important;
            padding: 40px 10px !important;
            text-align: center !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            -webkit-text-size-adjust: 100%;
        }

        /* Royal 24K Gold Matte Text Title */
        h1 {
            font-size: 32px !important;
            font-weight: 800 !important;
            text-transform: uppercase !important;
            letter-spacing: 4px !important;
            color: #d4af37 !important;
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa771c 100%) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            margin: 0 0 5px 0 !important;
            display: inline-block !important;
        }

        /* Gold Line Divider */
        .gold-line {
            height: 1px !important;
            width: 140px !important;
            background: linear-gradient(90deg, transparent, #d4af37, transparent) !important;
            margin: 12px auto 40px auto !important;
        }

        /* Mobile Responsive Single Column Layout */
        .luxury-vault {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 20px !important;
            width: 100% !important;
            max-width: 480px !important;
            margin: 0 auto !important;
            box-sizing: border-box !important;
        }

        /* Glassmorphism Premium Card Structure */
        .elite-card {
            background-color: #121224 !important;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0%, rgba(212, 175, 55, 0.06) 100%) !important;
            border: 1px solid #d4af37 !important;
            border-color: rgba(212, 175, 55, 0.4) !important;
            border-radius: 14px !important;
            padding: 24px 15px !important;
            width: 85% !important;
            max-width: 290px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
            box-sizing: border-box !important;
        }

        /* Diamond White Clean Name */
        .friend-name {
            font-size: 22px !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            letter-spacing: 1px !important;
            margin: 0 0 12px 0 !important;
            padding: 0 !important;
        }

        /* Matte Gold Nickname Badge */
        .friend-nickname {
            display: inline-block !important;
            font-size: 12px !important;
            text-transform: uppercase !important;
            letter-spacing: 2px !important;
            color: #f3e5ab !important;
            border: 1px solid rgba(243, 229, 171, 0.6) !important;
            padding: 5px 16px !important;
            border-radius: 20px !important;
            background: rgba(186, 135, 40, 0.15) !important;
            font-weight: 700 !important;
        }
    </style>
</head>
<body>

    <h1>The Elite Circle</h1>
    <div class="gold-line"></div>

    <div class="luxury-vault">

        <!-- Priyanka -->
        <div class="elite-card">
            <div class="friend-name">Priyanka</div>
            <div class="friend-nickname">BTS</div>
        </div>

        <!-- Krina -->
        <div class="elite-card">
            <div class="friend-name">Krina</div>
            <div class="friend-nickname">Panda</div>
        </div>

        <!-- Azana -->
        <div class="elite-card">
            <div class="friend-name">Azana</div>
            <div class="friend-nickname">62</div>
        </div>

        <!-- Seema -->
        <div class="elite-card">
            <div class="friend-name">Seema</div>
            <div class="friend-nickname">Semu</div>
        </div>

        <!-- Jahanvi -->
        <div class="elite-card">
            <div class="friend-name">Jahanvi</div>
            <div class="friend-nickname">Bo Chan</div>
        </div>

        <!-- Shahnawaz -->
        <div class="elite-card">
            <div class="friend-name">Shahnawaz</div>
            <div class="friend-nickname">Shaanu</div>
        </div>

        <!-- Farhan -->
        <div class="elite-card">
            <div class="friend-name">Farhan</div>
            <div class="friend-nickname">Fatima</div>
        </div>

        <!-- Zaid -->
        <div class="elite-card">
            <div class="friend-name">Zaid</div>
            <div class="friend-nickname">Gharwadi</div>
        </div>

    </div>

</body>
                                              </html>
